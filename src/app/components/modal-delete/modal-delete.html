<h2 mat-dialog-title class="d-flex align-items-center p-2"><mat-icon fontIcon="delete"></mat-icon> {{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close>Cancelar</button>
  <button matButton [mat-dialog-close]="'delete'" style="color: tomato;">Excluir</button>
</mat-dialog-actions>
